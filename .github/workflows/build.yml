name: Build ImmortalWrt

# Schedule: every Monday 02:00 UTC (10:00 Asia/Shanghai).
# Manual: Run workflow with a branch choice; builds every device listed in the matrix.

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt branch to build'
        required: false
        default: 'openwrt-25.12'
        type: choice
        options:
          - openwrt-25.12
          - master

env:
  IMMORTALWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  IMMORTALWRT_BRANCH: ${{ github.event.inputs.branch || 'openwrt-25.12' }}
  ROOT_DIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    # Per-device concurrency group: prevents two runs for the same device+branch
    # from racing; different devices/branches can build in parallel.
    # Note: concurrency expressions only allow github/inputs/vars/matrix — not env.
    concurrency:
      group: build-${{ matrix.device }}-${{ github.event.inputs.branch || 'openwrt-25.12' }}
      cancel-in-progress: false

    # To add a device:
    #   1. Copy its .config to files/<slug>.config
    #   2. Add the slug below
    #   3. (Optional) Add per-device files/patches under files/<slug>/
    strategy:
      fail-fast: false
      matrix:
        device: [r66s]
        # Examples for future expansion:
        # device: [r66s, redmi-ax6s, nanopi-r4s, x86_64]

    steps:
      - name: 清理 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 缓存源码包与 ccache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ROOT_DIR }}/_work/immortalwrt/dl
            ${{ env.ROOT_DIR }}/_work/immortalwrt/staging_dir/host
            ~/.ccache
          key: cache-${{ runner.os }}-${{ matrix.device }}-${{ env.IMMORTALWRT_BRANCH }}-${{ hashFiles(format('files/{0}.config', matrix.device)) }}
          restore-keys: |
            cache-${{ runner.os }}-${{ matrix.device }}-${{ env.IMMORTALWRT_BRANCH }}-
            cache-${{ runner.os }}-${{ matrix.device }}-
            cache-${{ runner.os }}-

      - name: 显示当前生效配置
        run: |
          echo "设备:    ${{ matrix.device }}"
          echo "分支:    $IMMORTALWRT_BRANCH"
          echo "配置:    $ROOT_DIR/files/${{ matrix.device }}.config"
          test -f "$ROOT_DIR/files/${{ matrix.device }}.config" \
            && echo "配置存在: 是" \
            || { echo "配置存在: 否 — 终止"; exit 1; }

      - name: 编译固件
        env:
          DEVICE: ${{ matrix.device }}
        run: bash scripts/build.sh

      - name: 列出编译产物
        if: always()
        run: |
          echo "=== bin 目录树 ==="
          find ${{ github.workspace }}/_work/output/${{ matrix.device }} -maxdepth 4 -type f 2>/dev/null | head -100 || true
          echo "=== SHA256SUMS ==="
          cat ${{ github.workspace }}/_work/output/${{ matrix.device }}/SHA256SUMS 2>/dev/null || true

      - name: 上传固件到 Artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: immortalwrt-${{ matrix.device }}-${{ env.IMMORTALWRT_BRANCH }}-${{ github.run_number }}
          path: ${{ github.workspace }}/_work/output/${{ matrix.device }}/**
          if-no-files-found: error
          retention-days: 30
