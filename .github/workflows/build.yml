name: Build ImmortalWrt (ImageBuilder)

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt release tag'
        required: false
        default: '25.12.2'
        type: string
      profile:
        description: 'R66S profile（自动查，留空）'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 装 zstd（IB 是 .tar.zst）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: 跑 IB build 脚本
        env:
          BRANCH: ${{ inputs.branch || '25.12.2' }}
          USER_PROFILE: ${{ inputs.profile }}
        run: bash scripts/build-ib.sh

      - name: 只挑 sysupgrade 镜像上传（不打包 packages/ 等中间产物）
        if: success()
        run: |
          echo '=== debug：当前目录 ==='
          pwd
          echo '=== debug：out/ 内容（IB 输出在这里）==='
          ls -lh out/ 2>&1 | head -20
          echo '=== debug：找 *-sysupgrade.img.gz ==='
          find out -name '*-sysupgrade.img.gz' 2>/dev/null | head -5
          echo '=== copy ==='
          mkdir -p artifact
          IMG=$(find out -name '*-squashfs-sysupgrade.img.gz' 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            IMG=$(find out -name '*-ext4-sysupgrade.img.gz' 2>/dev/null | head -1)
          fi
          if [ -n "$IMG" ]; then
            echo "  找到：$IMG"
            cp "$IMG" artifact/
          else
            echo "  ⚠️  没找到 sysupgrade 镜像——build 可能失败"
          fi
          echo '=== 上传 ==='
          ls -lh artifact/
          echo '=== sha256 ==='
          sha256sum artifact/*

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: immortalwrt-r66s-${{ inputs.branch || '25.12.2' }}-${{ github.run_number }}
          path: artifact/**
          if-no-files-found: error
          retention-days: 30

      - name: 创建草稿 release（人工手动 publish）
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          # sanitize branch 名：去掉 / 和其他会让 git tag 失效的字符
          tag_name: r66s-${{ inputs.branch || '25.12.2' | sed 's:/:_:g; s:[^a-zA-Z0-9._-]:_:g' }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          name: 'R66S build #${{ github.run_number }} (attempt ${{ github.run_attempt }})'
          body: |
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ inputs.branch || '25.12.2' }}
            Date: ${{ github.event.head_commit.timestamp }}
            *草稿——人工点 Publish release 后才永久保留*
          draft: true
          files: artifact/**